<script>
'use strict';
/* ===== STORE: progresso, XP, sequência, patentes, conquistas ===== */
const Store = (() => {
  const LIM_DIA = { afinar: 30, ouvido: 60, troca: 40, ritmo: 20, licao: 9999, musica: 9999, geral: 40 };
  let S = padrao();
  let boot = { email: '', nome: '' };
  let timer = null, sujo = false;
  let aoMudar = null;

  function padrao() {
    return { v: 1, t: 0, xp: 0, dias: [], done: {}, skip: {}, oui: { learn: {}, thr: 60, beat: 99, blind: [], sing: 0, tuned: 0, tunedManual: 0 },
      trocas: {}, conq: {}, cfg: { inst: 'violao', lefty: false, tema: 'auto', rec: true, a4: 440, afin: 'padrao', nome: '' }, cap: { d: 0, a: {} }, hoje: { d: 0, m: {} }, chords: {}, seen: {} };
  }
  function hojeNum(d) { d = d || new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); }

  // Sequência: dias consecutivos, com uma folga automática (1 dia sem treinar) a cada 7 dias de sequência.
  function calcSequencia(dias, hoje) {
    const set = new Set(dias);
    let cursor = set.has(hoje) ? hoje : hoje - 1; // hoje ainda pode ser salvo
    if (!set.has(cursor)) {
      if (set.has(cursor - 1)) cursor = cursor - 1; else return 0; // ontem sem treino = folga única
    }
    let seq = 0, ultimaFolga = -99, d = cursor;
    while (true) {
      if (set.has(d)) { seq++; d--; continue; }
      // dia vazio: permite folga se houver dia treinado antes e a última folga foi há mais de 7 dias
      if (set.has(d - 1) && seq - ultimaFolga >= 7 && ultimaFolga !== seq) { ultimaFolga = seq; d--; continue; }
      break;
    }
    return seq;
  }
  function patente(xp) {
    let i = 0;
    for (let k = 0; k < DATA.PATENTES.length; k++) if (xp >= DATA.PATENTES[k].min) i = k;
    const prox = DATA.PATENTES[i + 1];
    return { i: i, nome: DATA.PATENTES[i].nome, min: DATA.PATENTES[i].min, prox: prox ? prox.min : null, prog: prox ? (xp - DATA.PATENTES[i].min) / (prox.min - DATA.PATENTES[i].min) : 1 };
  }

  function marcarDia() {
    const h = hojeNum();
    if (S.dias.indexOf(h) < 0) { S.dias.push(h); S.dias = S.dias.slice(-60); }
    if (S.cap.d !== h) S.cap = { d: h, a: {} };
    if (S.hoje.d !== h) S.hoje = { d: h, m: {} };
  }
  function award(ativ, xp) {
    marcarDia();
    const lim = LIM_DIA[ativ] != null ? LIM_DIA[ativ] : LIM_DIA.geral;
    const usado = S.cap.a[ativ] || 0;
    const ganho = Math.max(0, Math.min(xp, lim - usado));
    S.cap.a[ativ] = usado + ganho;
    S.xp += ganho;
    checarConquistas();
    mudou();
    return ganho;
  }
  function missao(id) { marcarDia(); S.hoje.m[id] = 1; mudou(); }

  function generosFeitos() {
    const gs = new Set();
    DATA.GENEROS.forEach(g => { if (Object.keys(S.done).some(k => k.indexOf(g.id + ':') === 0)) gs.add(g.id); });
    return gs.size;
  }
  function checarConquistas() {
    const c = S.conq, h = hojeNum(), seq = calcSequencia(S.dias, h);
    const dar = id => { if (!c[id]) { c[id] = h; novas.push(id); } };
    const novas = [];
    if (S.oui.tuned > 0) dar('afinou');
    if (S.oui.blind.some(x => x <= 15)) dar('cego-bronze');
    if (S.oui.blind.some(x => x <= 5)) dar('cego-ouro');
    if (seq >= 3) dar('dias3'); if (seq >= 7) dar('dias7'); if (seq >= 30) dar('dias30');
    if (Object.keys(S.done).some(k => k.indexOf(':musica') > 0)) dar('musica1');
    if (Object.keys(S.done).some(k => k.indexOf(':musica') > 0 && S.done[k] >= 3)) dar('estrelas3');
    if (Object.keys(S.trocas).some(k => S.trocas[k] >= 30)) dar('troca30');
    if (generosFeitos() >= 5) dar('ecletico');
    if (patente(S.xp).i >= DATA.PATENTES.length - 1) dar('rei');
    if (novas.length && Store.aoConquistar) novas.forEach(id => Store.aoConquistar(id));
  }

  // Nível da trilha Ouvido: número de missões cumpridas em sequência (0..8)
  function ouvidoNivel() {
    const o = S.oui; let n = 0;
    const ok = [
      () => o.learn.l0, () => o.thr <= 25, () => o.learn.l2 && o.beat <= 8,
      () => o.learn.l3 && (o.tuned >= 3 || o.tunedManual), () => o.learn.l4,
      () => o.blind.filter(x => x <= 15).length >= 3, () => o.sing >= 3,
      () => o.blind.filter(x => x <= 8).length >= 6
    ];
    while (n < ok.length && ok[n]()) n++;
    return n;
  }

  function licoesDoGenero(g) {
    const m = DATA.MUSICAS[g.musica];
    const set = []; m.linhas.forEach(l => l.forEach(s => { if (set.indexOf(s.c) < 0) set.push(s.c); }));
    return [
      { id: g.id + ':acordes', genero: g.id, tipo: 'acordes', nivel: g.niv, titulo: 'Acordes de ' + g.nome, acordes: set },
      { id: g.id + ':levada', genero: g.id, tipo: 'levada', nivel: g.niv, titulo: 'Levada: ' + DATA.LEVADAS[g.levada].nome, levada: g.levada, acordes: set },
      { id: g.id + ':musica', genero: g.id, tipo: 'musica', nivel: g.niv, titulo: 'Música: ' + m.titulo + ' (andamento 70%)', musica: g.musica, tempo: 0.7, min: 1 },
      { id: g.id + ':musica2', genero: g.id, tipo: 'musica', nivel: Math.min(3, g.niv + 1), titulo: 'Música: ' + m.titulo + ' (andamento cheio)', musica: g.musica, tempo: 1, min: 2 }
    ];
  }
  function liberada(g, i) {
    const ls = licoesDoGenero(g);
    if (i === 0) return true;
    return !!(S.done[ls[i - 1].id] || S.skip[ls[i].id]);
  }

  function carregar(srv, local) {
    let st = null;
    const parse = s => { try { const o = JSON.parse(s); return o && o.v === 1 ? o : null; } catch (e) { return null; } };
    const a = srv ? parse(srv) : null, b = local ? parse(local) : null;
    st = a && b ? (b.t > a.t ? b : a) : (a || b);
    S = Object.assign(padrao(), st || {});
    S.oui = Object.assign(padrao().oui, S.oui || {});
    S.cfg = Object.assign(padrao().cfg, S.cfg || {});
    marcarDia();
    return b && a && b.t > a.t;
  }
  function serializar() { S.t = Date.now(); return JSON.stringify(S); }
  function mudou() {
    sujo = true; if (aoMudar) aoMudar();
    clearTimeout(timer); timer = setTimeout(salvar, 2500);
  }
  function salvar(forcar) {
    if (!sujo && !forcar) return;
    sujo = false;
    const js = serializar();
    try { localStorage.setItem('afinadim_p_' + boot.email, js); } catch (e) { /* armazenamento indisponível */ }
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.withFailureHandler(function () { sujo = true; }).saveProgress(js);
    }
  }
  return {
    get s() { return S; }, calcSequencia, hojeNum, patente, award, missao, ouvidoNivel, licoesDoGenero, liberada, carregar, salvar, mudou, padrao,
    setBoot(b) { boot = b; }, get boot() { return boot; }, onChange(f) { aoMudar = f; }, aoConquistar: null, checarConquistas, generosFeitos,
    reset() { S = padrao(); mudou(); salvar(true); }, _setS(x) { S = x; }
  };
})();
if (typeof module !== 'undefined') module.exports = Store;

/* ===== ÁUDIO: síntese, relógio, microfone e reconhecimento ===== */
const Som = (() => {
  let ctx = null, master = null;
  function init() {
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      ctx = new C({ latencyHint: 'interactive' });
      master = ctx.createGain(); master.gain.value = 0.85; master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function a4() { return Store.s.cfg.a4 || 440; }
  // nota "dedilhada" por síntese aditiva (harmônicos com decaimento diferente)
  function pluck(freq, when, dur, vel) {
    init();
    const t0 = when == null ? ctx.currentTime : when;
    dur = dur || 1.8; vel = vel == null ? 0.5 : vel;
    const hs = Math.max(1, Math.min(6, Math.floor((ctx.sampleRate / 2 - 300) / freq)));
    for (let h = 1; h <= hs; h++) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = freq * h;
      const amp = (vel * 0.32) / Math.pow(h, 1.1);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(amp, t0 + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur / (1 + 0.55 * (h - 1)));
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0 + dur + 0.05);
    }
  }
  function freqMidi(m) { return DSP.midiToFreq(m, a4()); }
  function strum(nome, tipo, when, vel) {
    const ac = DATA.ACORDES[nome]; if (!ac) return;
    init();
    const t0 = when == null ? ctx.currentTime : when;
    const notas = DSP.notasDoAcorde(ac.f);
    vel = vel == null ? 0.6 : vel;
    if (tipo === 'B') { pluck(freqMidi(notas[0]), t0, 0.9, vel); return; }
    let lista = notas, esp = 0.014, dur = 1.8, v = vel;
    if (tipo === 'U') { lista = notas.slice(-4).reverse(); esp = 0.009; dur = 0.9; v = vel * 0.8; }
    if (tipo === 'x') { dur = 0.09; v = vel * 0.45; esp = 0.004; }
    if (tipo === 'C') { dur = 0.35; esp = 0.006; }
    lista.forEach((m, i) => pluck(freqMidi(m), t0 + i * esp, dur, v / Math.sqrt(lista.length / 3)));
  }
  // tom contínuo (para exercícios de ouvido). Retorna objeto de controle.
  function tom(freq, vol) {
    init();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.linearRampToValueAtTime(vol == null ? 0.22 : vol, ctx.currentTime + 0.05);
    o.connect(g); g.connect(master); o.start();
    return {
      freq: function (f) { o.frequency.setTargetAtTime(f, ctx.currentTime, 0.01); },
      stop: function () { try { g.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.03); o.stop(ctx.currentTime + 0.2); } catch (e) { /* já parado */ } }
    };
  }
  function click(when, acento) {
    init();
    const t0 = when == null ? ctx.currentTime : when;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square'; o.frequency.value = acento ? 1500 : 1000;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(acento ? 0.28 : 0.18, t0 + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.05);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + 0.07);
  }
  return { init, pluck, strum, tom, click, freqMidi, get ctx() { return ctx; }, get rate() { return ctx ? ctx.sampleRate : 48000; } };
})();

/* Relógio de pulsos (usa o relógio do navegador e agenda o som com antecedência) */
function Relogio() {
  let id = null, n = 0, prox = 0, msFn = null, cb = null;
  return {
    iniciar: function (getMs, aoPulso, atraso) {
      this.parar();
      msFn = getMs; cb = aoPulso; n = 0; prox = performance.now() + (atraso || 60);
      id = setInterval(function () {
        const agora = performance.now();
        while (agora >= prox - 35) {
          const d = Math.max(0, (prox - agora) / 1000);
          cb(n, Som.ctx ? Som.ctx.currentTime + d : 0);
          n++; prox += msFn();
        }
      }, 20);
    },
    parar: function () { if (id) clearInterval(id); id = null; },
    get ativo() { return id != null; }
  };
}

const Mic = {
  ok: false, erro: '', msg: '', stream: null, an: null, an2: null, src: null, buf: null, spec: null,
  async iniciar() {
    if (this.ok) return true;
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw Object.assign(new Error('mediaDevices indisponível'), { name: 'SemMediaDevices' });
      const st = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      const c = Som.init();
      this.src = c.createMediaStreamSource(st);
      this.an = c.createAnalyser(); this.an.fftSize = 4096; this.an.smoothingTimeConstant = 0;
      this.src.connect(this.an);
      this.buf = new Float32Array(4096);
      this.stream = st; this.ok = true; this.erro = ''; this.msg = '';
      return true;
    } catch (e) {
      this.erro = (e && e.name) || 'Erro'; this.msg = (e && e.message) || ''; this.ok = false;
      return false;
    }
  },
  analisadorCroma() {
    if (!this.ok || this.an2) return;
    const c = Som.ctx;
    this.an2 = c.createAnalyser(); this.an2.fftSize = 16384; this.an2.smoothingTimeConstant = 0.25;
    this.src.connect(this.an2);
    this.spec = new Float32Array(this.an2.frequencyBinCount);
  },
  altura() {
    this.an.getFloatTimeDomainData(this.buf);
    return DSP.mpm(this.buf.subarray(this.buf.length - 3072), Som.rate, { minF: 55, maxF: 1200 });
  },
  nivel() {
    this.an.getFloatTimeDomainData(this.buf);
    let e = 0; const n = 2048, s = this.buf.length - n;
    for (let i = 0; i < n; i++) e += this.buf[s + i] * this.buf[s + i];
    return Math.sqrt(e / n);
  },
  croma() {
    this.an2.getFloatFrequencyData(this.spec);
    return DSP.chroma(DSP.dbParaMag(this.spec), Som.rate, this.an2.fftSize);
  },
  parar() {
    try { if (this.stream) this.stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) { /* ok */ }
    this.ok = false; this.an = null; this.an2 = null; this.src = null; this.stream = null;
  }
};

/* Reconhecedor de acordes por croma, com vocabulário limitado à lição */
const Recog = {
  vocab: {},
  definir(nomes) {
    this.vocab = {};
    nomes.forEach(function (n) { if (DATA.ACORDES[n]) Recog.vocab[n] = DSP.template(DATA.ACORDES[n].f); });
  },
  ler() {
    const rms = Mic.nivel();
    if (rms < 0.012) return { best: null, sim: 0, margem: 0, rms: rms };
    const r = DSP.classificar(Mic.croma(), this.vocab);
    r.rms = rms; return r;
  }
};

/* ===== UI: núcleo, navegação, Hoje, Trilhas, lições ===== */
const $ = function (s) { return document.querySelector(s); };
const esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
const ACT = {}, INP = {}, VIEWS = {}, POS = [];
const UI = { tab: 'hoje', sub: null, limpeza: [], nivel: 0, lv: { id: '', chord: '', bpm: 90, rodando: false, metro: true }, toastT: null };

function aoSair(fn) { UI.limpeza.push(fn); }
function limpar() { UI.limpeza.forEach(function (f) { try { f(); } catch (e) { /* ignora */ } }); UI.limpeza = []; }
function pos(fn) { POS.push(fn); }
function go(tab, sub) { limpar(); UI.tab = tab; UI.sub = sub || null; render(); window.scrollTo(0, 0); }
function render() {
  POS.length = 0;
  let html = '';
  try { html = VIEWS[UI.tab](); } catch (e) { html = '<div class="card bad">Ocorreu um erro ao abrir esta tela: ' + esc(e.message) + '</div>'; console.error(e); }
  $('#view').innerHTML = html;
  POS.slice().forEach(function (f) { try { f(); } catch (e) { console.error(e); } });
  chrome();
}
function toast(msg, ms) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.classList.remove('hide');
  clearTimeout(UI.toastT); UI.toastT = setTimeout(function () { t.classList.add('hide'); }, ms || 2600);
}
const ICO = {
  hoje: '<path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 2.5 1.5 2.5C11 9 10.5 5.5 12 3z"/>',
  trilhas: '<circle cx="6" cy="6" r="2.2"/><circle cx="18" cy="18" r="2.2"/><path d="M8 6h6a3 3 0 0 1 0 6h-4a3 3 0 0 0 0 6h6"/>',
  palco: '<path d="M7 4l13 8-13 8z"/>',
  ouvido: '<path d="M3 12h2M7 7v10M11 4v16M15 8v8M19 10v4M22 12h-1"/>',
  mais: '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>'
};
function ico(n) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICO[n] + '</svg>'; }
function chrome() {
  const s = Store.s, p = Store.patente(s.xp), seq = Store.calcSequencia(s.dias, Store.hojeNum());
  $('#chips').innerHTML =
    '<button class="chip am" data-a="go" data-p="mais|progresso" aria-label="Sequência de ' + seq + ' dias"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICO.hoje + '</svg>' + seq + '</button>' +
    '<button class="chip" data-a="go" data-p="mais|progresso" aria-label="Patente ' + esc(p.nome) + ', ' + s.xp + ' XP">' + esc(p.nome) + ' · ' + s.xp + '</button>';
  const abas = [['hoje', 'Hoje'], ['trilhas', 'Trilhas'], ['palco', 'Palco'], ['ouvido', 'Ouvido'], ['mais', 'Mais']];
  $('#tabs').innerHTML = abas.map(function (a) {
    return '<button data-a="go" data-p="' + a[0] + '" class="' + (UI.tab === a[0] ? 'on' : '') + '" ' + (UI.tab === a[0] ? 'aria-current="page"' : '') + '>' + ico(a[0]) + a[1] + '</button>';
  }).join('');
}

/* ---- Diagrama de acorde em SVG ---- */
function chordSVG(nome, w) {
  const a = DATA.ACORDES[nome]; if (!a) return '';
  const f = a.f, lefty = Store.s.cfg.lefty;
  const pos_ = f.filter(function (x) { return x > 0; });
  const max = pos_.length ? Math.max.apply(null, pos_) : 0, min = pos_.length ? Math.min.apply(null, pos_) : 0;
  const base = max > 4 ? min : 1, nF = 4, W = 120, H = 140, x0 = 22, y0 = 30, dx = (W - 2 * x0) / 5, dy = (H - y0 - 8) / nF;
  const X = function (i) { return x0 + (lefty ? 5 - i : i) * dx; };
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + (w || 110) + '" role="img" aria-label="Acorde ' + esc(nome) + '">';
  for (let i = 0; i < 6; i++) s += '<line x1="' + X(i) + '" y1="' + y0 + '" x2="' + X(i) + '" y2="' + (y0 + nF * dy) + '" stroke="var(--ln2)" stroke-width="1.5"/>';
  for (let j = 0; j <= nF; j++) s += '<line x1="' + x0 + '" y1="' + (y0 + j * dy) + '" x2="' + (W - x0) + '" y2="' + (y0 + j * dy) + '" stroke="' + (j === 0 && base === 1 ? 'var(--tx)' : 'var(--ln2)') + '" stroke-width="' + (j === 0 && base === 1 ? 4 : 1.5) + '"/>';
  if (base > 1) s += '<text x="' + (W - 4) + '" y="' + (y0 + dy * 0.62) + '" text-anchor="end" font-size="11" fill="var(--tx2)" font-family="var(--f-m)">' + base + 'ª</text>';
  if (a.pestana) {
    const idx = []; f.forEach(function (v, i) { if (v === a.pestana) idx.push(i); });
    const xa = Math.min.apply(null, idx.map(X)), xb = Math.max.apply(null, idx.map(X)), cy = y0 + (a.pestana - base + 0.5) * dy;
    s += '<rect x="' + (xa - 7) + '" y="' + (cy - 7) + '" width="' + (xb - xa + 14) + '" height="14" rx="7" fill="var(--amb)"/>';
  }
  for (let i = 0; i < 6; i++) {
    const v = f[i], x = X(i);
    if (v < 0) s += '<path d="M' + (x - 4) + ' 10l8 8M' + (x + 4) + ' 10l-8 8" stroke="var(--tx2)" stroke-width="2" stroke-linecap="round"/>';
    else if (v === 0) s += '<circle cx="' + x + '" cy="14" r="4.5" fill="none" stroke="var(--tx2)" stroke-width="2"/>';
    else {
      const cy = y0 + (v - base + 0.5) * dy;
      if (!(a.pestana && v === a.pestana && a.d[i] === 1)) s += '<circle cx="' + x + '" cy="' + cy + '" r="8" fill="var(--amb)"/>';
      if (a.d[i] > 0) s += '<text x="' + x + '" y="' + (cy + 4) + '" text-anchor="middle" font-size="11" font-weight="700" fill="var(--on-am)" font-family="var(--f-m)">' + a.d[i] + '</text>';
    }
  }
  return s + '</svg>';
}

/* ---- Escuta de um acorde (verificação) ---- */
async function escutar(nome, vocab, cb, ms) {
  const ok = await Mic.iniciar();
  if (!ok) { cb({ erro: true }); return function () {}; }
  Mic.analisadorCroma(); Recog.definir(vocab);
  let seguidos = 0; const t0 = Date.now();
  const id = setInterval(function () {
    const r = Recog.ler();
    if (r.best === nome && r.sim >= 0.7) seguidos++; else seguidos = 0;
    if (seguidos >= 2) { clearInterval(id); cb({ ganhou: true, r: r }); }
    else if (Date.now() - t0 > ms) { clearInterval(id); cb({ tempo: true, r: r }); }
    else cb({ r: r, seguidos: seguidos });
  }, 110);
  const parar = function () { clearInterval(id); };
  aoSair(parar);
  return parar;
}
function msgMic() {
  const e = Mic.erro;
  if (e === 'NotAllowedError' || e === 'SecurityError') return 'O navegador bloqueou o microfone. Libere a permissão no cadeado do endereço (ou veja Ajustes > Testar microfone). Enquanto isso, use o modo manual.';
  if (e === 'NotFoundError') return 'Nenhum microfone foi encontrado neste aparelho.';
  if (e === 'SemMediaDevices') return 'Este navegador ou esta tela não permite microfone aqui. Veja Ajustes > Testar microfone.';
  return 'Não consegui acessar o microfone (' + esc(e) + '). Veja Ajustes > Testar microfone.';
}

    if (sd < 3) OU.estavel = { idx: idx, cents: mu };

    const g = $('#gnome'); if (g) g.textContent = '?';

    return;
  }
  const g = $('#gnome'); if (g) g.textContent = nome;

    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([js], { type: 'application/json' })); a.download = 'afinadim-progresso.json'; document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { /* ignora */ }
  const box = $('#impbox'); box.classList.remove('hide'); $('#imptxt').value = js; toast('Copie o texto abaixo se o download não iniciar.');
};
ACT.importarAbrir = function () { $('#impbox').classList.remove('hide'); };
ACT.importar = function () {
  const t = $('#imptxt').value.trim();
  try { const o = JSON.parse(t); if (!o || o.v !== 1) throw new Error('formato'); o.t = Date.now(); Store.carregar(JSON.stringify(o), null); Store.mudou(); Store.salvar(true); aplicarTema(); toast('Progresso importado.'); render(); }
  catch (e) { toast('Conteúdo inválido.'); }
};
ACT.resetar = function () {
  if (!confirmaReset) { confirmaReset = true; render(); setTimeout(function () { confirmaReset = false; }, 4000); return; }
  confirmaReset = false; Store.reset(); aplicarTema(); toast('Progresso zerado.'); render();
};

/* ---------- SOBRE ---------- */
function vSobre() {
  return voltarMais + '<h1 style="margin-top:12px">Afinadim</h1><p class="dim">Violão e guitarra que escutam você. Versão 0.1 (primeira entrega).</p>' +
    '<div class="card"><h3>Privacidade</h3><p class="small" style="margin-top:6px">O áudio do microfone é analisado no seu aparelho e nunca é gravado nem enviado. O que fica salvo é o seu progresso (XP, lições, configurações), na sua conta Google dentro do Afinadim e neste navegador.</p></div>' +
    '<div class="card"><h3>Conteúdo</h3><p class="small" style="margin-top:6px">Músicas, letras e lições são originais do projeto. Os padrões de levada são estudos base e serão revisados com músicos. Os dados de popularidade dos gêneros vêm da pesquisa Globo/Quaest (2026) e dos rankings Pro-Música/BMAT.</p></div>' +
    '<div class="card"><h3>Tecnologia</h3><p class="small" style="margin-top:6px">Código próprio: detecção de altura (método McLeod), reconhecimento de acordes por croma e síntese de som no navegador, sem vídeo e sem bibliotecas externas. Fontes: Bricolage Grotesque, Instrument Sans e JetBrains Mono (licença OFL).</p></div>';
}

/* ===== APP: inicialização e eventos ===== */
document.addEventListener('click', function (e) {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.a];
  if (fn) { try { fn(el.dataset.p, el, e); } catch (err) { console.error(err); toast('Algo deu errado: ' + err.message); } }
});
document.addEventListener('input', function (e) {
  const el = e.target.closest('[data-i]');
  if (el && INP[el.dataset.i]) INP[el.dataset.i](el.value, el, e);
});
document.addEventListener('change', function (e) {
  const el = e.target.closest('[data-c]');
  if (el && CHG[el.dataset.c]) { try { CHG[el.dataset.c](el.value, el, e); } catch (err) { console.error(err); } }
});
ACT.go = function (p) {
  const i = p.indexOf('|');
  if (i < 0) go(p, null); else go(p.slice(0, i), p.slice(i + 1));
};

function iniciarApp(b) {
  b = b || {};
  Store.setBoot({ email: b.email || '', nome: b.nome || '' });
  let local = null;
  try { local = localStorage.getItem('afinadim_p_' + (b.email || '')); } catch (e) { /* sem acesso */ }
  Store.carregar(b.progress || null, local);
  aplicarTema();
  Store.aoConquistar = function (id) {
    const c = DATA.CONQUISTAS.find(function (x) { return x.id === id; });
    if (c) setTimeout(function () { toast('Conquista: ' + c.nome); }, 400);
  };
  Store.onChange(function () { chrome(); });
  const bt = $('#boot'); if (bt) bt.remove();
  $('#shell').classList.remove('hide');
  go('hoje');
  document.addEventListener('visibilitychange', function () { if (document.hidden) Store.salvar(true); });
  window.addEventListener('pagehide', function () { Store.salvar(true); });
  Store.salvar(true);
}
(function boot() {
  const falha = function (e) {
    const bt = $('#boot'); if (bt) bt.querySelector('p').textContent = 'Não consegui carregar o seu perfil (' + (e && e.message ? e.message : 'sem conexão') + '). Abrindo no modo local.';
    setTimeout(function () { iniciarApp({ email: 'local', nome: 'músico' }); }, 900);
  };
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run.withSuccessHandler(iniciarApp).withFailureHandler(falha).getBoot();
  } else iniciarApp({ email: 'local', nome: 'músico' });
})();

</script>
