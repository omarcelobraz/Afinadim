<script>
/* ===== DSP: funções puras (altura, croma, acordes, síntese de teste) ===== */
const DSP = (() => {
  const NOTAS = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const SOLFEJO = ['Dó', 'Dó#', 'Ré', 'Ré#', 'Mi', 'Fá', 'Fá#', 'Sol', 'Sol#', 'Lá', 'Lá#', 'Si'];
  const CORDAS_ABERTAS = [40, 45, 50, 55, 59, 64]; // E2 A2 D3 G3 B3 E4 (MIDI), da corda 6 para a 1

  function midiToFreq(m, a4) { return (a4 || 440) * Math.pow(2, (m - 69) / 12); }
  function freqToMidi(f, a4) { return 69 + 12 * Math.log2(f / (a4 || 440)); }
  function centsBetween(f, ref) { return 1200 * Math.log2(f / ref); }
  function noteInfo(f, a4) {
    const m = freqToMidi(f, a4);
    const n = Math.round(m);
    const pc = ((n % 12) + 12) % 12;
    return { midi: n, pc: pc, nome: NOTAS[pc], solfejo: SOLFEJO[pc], oitava: Math.floor(n / 12) - 1, cents: (m - n) * 100 };
  }
  function nomeMidi(n) { return NOTAS[((n % 12) + 12) % 12] + (Math.floor(n / 12) - 1); }

  /* ---- McLeod Pitch Method (NSDF) ---- */
  function mpm(buf, sr, opt) {
    opt = opt || {};
    const minF = opt.minF || 60, maxF = opt.maxF || 1300, k = opt.k || 0.9, gate = opt.gate == null ? 0.008 : opt.gate;
    const W = buf.length;
    let e = 0;
    for (let i = 0; i < W; i++) e += buf[i] * buf[i];
    const rms = Math.sqrt(e / W);
    if (rms < gate) return { freq: 0, clarity: 0, rms: rms };
    const maxLag = Math.min(Math.floor(sr / minF), W - 64);
    const minLag = Math.max(2, Math.floor(sr / maxF));
    const nsdf = new Float32Array(maxLag + 2);
    for (let tau = 0; tau <= maxLag + 1; tau++) {
      let acf = 0, m = 0;
      const n = W - tau;
      for (let j = 0; j < n; j++) {
        const a = buf[j], b = buf[j + tau];
        acf += a * b;
        m += a * a + b * b;
      }
      nsdf[tau] = m > 0 ? (2 * acf) / m : 0;
    }
    let i = 0;
    while (i < maxLag && nsdf[i] > 0) i++; // fim do primeiro lóbulo positivo
    const picos = [];
    let curMax = -1, curIdx = -1;
    for (; i <= maxLag; i++) {
      if (nsdf[i] > 0) {
        if (nsdf[i] > curMax) { curMax = nsdf[i]; curIdx = i; }
      } else {
        if (curIdx > 0) picos.push(curIdx);
        curMax = -1; curIdx = -1;
      }
    }
    if (curIdx > 0) picos.push(curIdx);
    let maior = 0;
    const validos = [];
    for (const p of picos) {
      if (p < minLag) continue;
      validos.push(p);
      if (nsdf[p] > maior) maior = nsdf[p];
    }
    if (!validos.length) return { freq: 0, clarity: 0, rms: rms };
    let escolhido = validos[0];
    for (const p of validos) { if (nsdf[p] >= k * maior) { escolhido = p; break; } }
    const y0 = nsdf[escolhido - 1], y1 = nsdf[escolhido], y2 = nsdf[escolhido + 1];
    const den = y0 - 2 * y1 + y2;
    const shift = den !== 0 ? (0.5 * (y0 - y2)) / den : 0;
    const lag = escolhido + shift;
    const clar = y1 - 0.25 * (y0 - y2) * shift;
    return { freq: sr / lag, clarity: Math.min(1, clar), rms: rms };
  }

  /* ---- Croma (12 classes de altura) a partir de espectro de magnitude linear ---- */
  function chroma(mag, sr, fftSize, fmin, fmax) {
    fmin = fmin || 80; fmax = fmax || 2200;
    const c = new Float32Array(12);
    const binHz = sr / fftSize;
    const k0 = Math.max(1, Math.ceil(fmin / binHz)), k1 = Math.min(mag.length - 1, Math.floor(fmax / binHz));
    for (let k = k0; k <= k1; k++) {
      const m = 69 + 12 * Math.log2((k * binHz) / 440);
      const n = Math.round(m);
      if (Math.abs(m - n) > 0.34) continue; // ignora vazamento entre semitons
      c[((n % 12) + 12) % 12] += mag[k];
    }
    return c;
  }
  function dbParaMag(db) { const out = new Float32Array(db.length); for (let i = 0; i < db.length; i++) out[i] = Math.pow(10, db[i] / 20); return out; }

  /* ---- Modelo (template) de acorde a partir das casas, com harmônicos ---- */
  function notasDoAcorde(frets) {
    const n = [];
    for (let s = 0; s < 6; s++) if (frets[s] >= 0) n.push(CORDAS_ABERTAS[s] + frets[s]);
    return n;
  }
  function template(frets) {
    const t = new Float32Array(12);
    const notas = notasDoAcorde(frets);
    notas.forEach((m, idx) => {
      const peso = idx === 0 ? 1.25 : 1; // baixo pesa um pouco mais
      for (let h = 1; h <= 6; h++) {
        const mh = m + 12 * Math.log2(h);
        const pc = ((Math.round(mh) % 12) + 12) % 12;
        t[pc] += peso / h;
      }
    });
    return t;
  }
  function cosseno(a, b) {
    let d = 0, na = 0, nb = 0;
    for (let i = 0; i < 12; i++) { d += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i]; }
    return na > 0 && nb > 0 ? d / Math.sqrt(na * nb) : 0;
  }
  // vocab: { 'G': templateFloat32, ... } -> melhor acorde e similaridades
  function classificar(c, vocab) {
    let best = null, bs = 0, second = 0;
    const sims = {};
    for (const nome in vocab) {
      const s = cosseno(c, vocab[nome]);
      sims[nome] = s;
      if (s > bs) { second = bs; bs = s; best = nome; } else if (s > second) second = s;
    }
    return { best: best, sim: bs, margem: bs - second, sims: sims };
  }

  /* ---- Síntese aditiva (usada nos testes e como gerador offline) ---- */
  function pluckBuffer(freq, sr, dur, vel) {
    const n = Math.floor(sr * dur), out = new Float32Array(n);
    const hs = Math.min(8, Math.floor((sr / 2 - 100) / freq));
    for (let h = 1; h <= hs; h++) {
      const amp = (vel || 0.3) / Math.pow(h, 1.1), tau = dur / (1.6 + 0.7 * h), w = (2 * Math.PI * freq * h) / sr;
      for (let i = 0; i < n; i++) out[i] += amp * Math.exp(-i / sr / tau * 3) * Math.sin(w * i);
    }
    return out;
  }

  /* ---- Mediana ---- */
  function mediana(arr) { const a = arr.slice().sort((x, y) => x - y); const m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; }

  return { NOTAS, SOLFEJO, CORDAS_ABERTAS, midiToFreq, freqToMidi, centsBetween, noteInfo, nomeMidi, mpm, chroma, dbParaMag, notasDoAcorde, template, cosseno, classificar, pluckBuffer, mediana };
})();
if (typeof module !== 'undefined') module.exports = DSP;

/* ===== DADOS DO AFINADIM (todo o conteúdo é original do projeto) ===== */
const DATA = (() => {
  // Casas por corda, da 6ª (grave) para a 1ª (aguda). -1 = corda não tocada, 0 = solta.
  const ACORDES = {
    'C': { f: [-1, 3, 2, 0, 1, 0], d: [0, 3, 2, 0, 1, 0], tipo: 'maior' },
    'D': { f: [-1, -1, 0, 2, 3, 2], d: [0, 0, 0, 1, 3, 2], tipo: 'maior' },
    'E': { f: [0, 2, 2, 1, 0, 0], d: [0, 2, 3, 1, 0, 0], tipo: 'maior' },
    'G': { f: [3, 2, 0, 0, 0, 3], d: [2, 1, 0, 0, 0, 3], tipo: 'maior' },
    'A': { f: [-1, 0, 2, 2, 2, 0], d: [0, 0, 1, 2, 3, 0], tipo: 'maior' },
    'F': { f: [1, 3, 3, 2, 1, 1], d: [1, 3, 4, 2, 1, 1], tipo: 'maior', pestana: 1 },
    'Bb': { f: [-1, 1, 3, 3, 3, 1], d: [0, 1, 2, 3, 4, 1], tipo: 'maior', pestana: 1 },
    'B': { f: [-1, 2, 4, 4, 4, 2], d: [0, 1, 2, 3, 4, 1], tipo: 'maior', pestana: 2 },
    'Am': { f: [-1, 0, 2, 2, 1, 0], d: [0, 0, 2, 3, 1, 0], tipo: 'menor' },
    'Dm': { f: [-1, -1, 0, 2, 3, 1], d: [0, 0, 0, 2, 3, 1], tipo: 'menor' },
    'Em': { f: [0, 2, 2, 0, 0, 0], d: [0, 2, 3, 0, 0, 0], tipo: 'menor' },
    'Bm': { f: [-1, 2, 4, 4, 3, 2], d: [0, 1, 3, 4, 2, 1], tipo: 'menor', pestana: 2 },
    'F#m': { f: [2, 4, 4, 2, 2, 2], d: [1, 3, 4, 1, 1, 1], tipo: 'menor', pestana: 2 },
